<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Feather Atlas — 3D Avian Field Guide</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">

  <!-- Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* CSS Custom Properties */
    :root {
      --bg: #f6f1e7;
      --panel: #fbf8f1;
      --line: #e7e0d1;
      --ink: #1b1a17;
      --muted: #6d685d;
      --sage: #4d5a3d;
      --sage-ink: #ffffff;
      --sage-tint: #e9ebdc;
      --chip: #efeadd;
      --shadow: 60, 48, 28;
      --ease: cubic-bezier(.22, .8, .24, 1);
    }

    .hero[data-light="dusk"] {
      --bg: #14170f;
      --panel: #1b1f15;
      --line: #2d3324;
      --ink: #f2ecdf;
      --muted: #a8a392;
      --sage: #a9b98a;
      --sage-ink: #14170f;
      --sage-tint: #283020;
      --chip: #262b1d;
      --shadow: 0, 0, 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background 0.6s var(--ease), color 0.6s var(--ease);
    }

    :focus-visible {
      outline: 2px solid var(--sage);
      outline-offset: 2px;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
    }

    input {
      font-family: inherit;
      color: inherit;
      border: none;
      background: none;
    }

    .svg-icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Hero Shell */
    .hero {
      position: relative;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: grid;
      grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
      background: var(--bg);
      color: var(--ink);
      transition: background 0.6s var(--ease), color 0.6s var(--ease);
    }

    /* 3D Canvas across the entire hero */
    #gl {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      width: 100%;
      height: 100%;
    }

    /* 1) Left Sidebar */
    .sidebar {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 22px 12px 18px 24px;
      border-right: 1px solid var(--line);
      background: var(--bg);
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease), background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .brand {
      font-family: "Newsreader", "Iowan Old Style", Georgia, serif;
      font-size: 26px;
      letter-spacing: -0.01em;
      font-weight: 500;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-list {
      margin: 20px 0 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 14.5px;
      color: var(--ink);
      text-align: left;
      transition: background 0.2s var(--ease);
    }

    .nav-btn:hover {
      background: var(--chip);
    }

    .nav-btn[aria-current="page"] {
      background: var(--sage-tint);
      color: var(--sage);
      font-weight: 600;
    }

    .nav-btn small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      font-weight: 400;
    }

    .featured-card {
      margin-top: auto;
      background: var(--sage-tint);
      border-radius: 10px;
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: background 0.6s var(--ease);
    }

    .eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .featured-img-wrap {
      width: 100%;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .featured-img-wrap img {
      width: 92px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(var(--shadow), 0.15));
      transition: transform 0.4s var(--ease);
    }

    .featured-title {
      font-family: "Newsreader", serif;
      font-size: 18px;
      color: var(--ink);
      font-weight: 500;
      line-height: 1.2;
    }

    .featured-text {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .featured-link {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      cursor: pointer;
    }

    /* 2) Centre Column */
    .section-main {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: 48px 18px 14px 26px;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .tabs-row {
      display: flex;
      gap: 10px;
      z-index: 12;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .tab-btn {
      width: 130px;
      padding: 8px 8px 11px;
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s var(--ease), background 0.3s var(--ease), border-color 0.3s var(--ease);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn[aria-selected="true"] {
      background: var(--sage-tint);
      border-color: color-mix(in srgb, var(--sage) 45%, transparent);
    }

    .tab-btn img {
      width: 58px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(var(--shadow), 0.12));
    }

    .tab-name {
      font-family: "Newsreader", serif;
      font-size: 15.5px;
      font-weight: 500;
      color: var(--ink);
      margin-top: 4px;
    }

    .tab-latin {
      font-family: "Newsreader", serif;
      font-style: italic;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Stage Area */
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      user-select: none;
      outline: none;
    }

    #stage:active {
      cursor: grabbing;
    }

    /* Ground Shadow */
    .ground-shadow {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      width: min(62%, 460px);
      height: 44px;
      background: radial-gradient(closest-side, rgba(var(--shadow), 0.22), transparent);
      pointer-events: none;
      border-radius: 50%;
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
      z-index: 1;
    }

    .ground-shadow.switching {
      opacity: 0;
      transform: translateX(-50%) scaleX(0.4);
    }

    /* Stage Loader */
    .stage-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease);
      z-index: 20;
    }

    .stage-loader.active {
      opacity: 1;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 1.5px solid var(--line);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 12.5px;
      color: var(--muted);
    }

    /* Fallback image */
    .stage-fallback {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 65%;
      max-height: 65%;
      object-fit: contain;
      display: none;
      pointer-events: none;
      z-index: 4;
    }

    /* Hint */
    .stage-hint {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.4s var(--ease);
      z-index: 15;
    }

    .stage-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Icon Rail (left of stage) */
    .icon-rail {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 9px;
      z-index: 15;
    }

    .rail-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--panel);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }

    .rail-btn:hover {
      border-color: var(--sage);
    }

    .rail-btn:active {
      transform: scale(0.92);
    }

    .rail-btn.active {
      background: var(--sage);
      color: var(--sage-ink);
      border-color: var(--sage);
    }

    .rail-btn .svg-icon {
      width: 17px;
      height: 17px;
    }

    /* Turn Pill */
    .turn-pill {
      position: absolute;
      bottom: 46px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      z-index: 15;
      box-shadow: 0 4px 14px rgba(var(--shadow), 0.08);
      transition: background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .turn-btn {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s var(--ease);
    }

    .turn-btn:hover {
      background: var(--chip);
    }

    /* Caption */
    .stage-caption {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-family: "Newsreader", serif;
      font-style: italic;
      font-size: clamp(16px, 1.55vw, 20px);
      color: var(--muted);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.3s var(--ease);
    }

    /* 3) Right Column (Info Card) */
    .section-info {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      padding: 13px 26px 14px 0;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .info-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      height: 32px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      color: var(--ink);
      transition: border-color 0.2s, background 0.6s var(--ease);
    }

    .search-box:focus-within {
      border-color: var(--sage);
    }

    .search-box input {
      width: 100%;
      font-size: 11.5px;
      color: var(--ink);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    .top-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--ink);
      transition: background 0.2s;
    }

    .top-btn:hover {
      background: var(--chip);
    }

    .user-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bg);
      display: grid;
      place-items: center;
    }

    .user-avatar .svg-icon {
      width: 14px;
      height: 14px;
    }

    /* Detail Card */
    .detail-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 22px 20px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
      transition: background 0.6s var(--ease), border-color 0.6s var(--ease);
    }

    .detail-card::-webkit-scrollbar {
      width: 5px;
    }

    .detail-card::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 4px;
    }

    .detail-article {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .detail-child {
      transition: opacity 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .detail-article.anim-out .detail-child {
      opacity: 0;
      transform: translateY(-6px);
    }

    .detail-article.anim-in .detail-child {
      animation: enterDetail 0.6s var(--ease) forwards;
    }

    @keyframes enterDetail {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bird-h1 {
      font-family: "Newsreader", serif;
      font-size: clamp(40px, 4.2vw, 54px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.025em;
      margin-top: 8px;
      color: var(--ink);
    }

    .tag-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }

    .tag-pill {
      font-size: 11.5px;
      padding: 6px 13px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--ink);
      font-weight: 600;
      transition: background 0.6s var(--ease);
    }

    .bird-desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--muted);
      margin-top: 16px;
      text-wrap: pretty;
    }

    .section-h2 {
      font-family: "Newsreader", serif;
      font-size: 21px;
      font-weight: 400;
      color: var(--ink);
      border-top: 1px solid var(--line);
      padding-top: 14px;
      margin-top: 18px;
      margin-bottom: 12px;
    }

    .trait-grid {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .trait-row {
      display: grid;
      grid-template-columns: 22px 88px 1fr;
      gap: 16px;
      font-size: 13px;
      align-items: center;
    }

    .trait-label {
      color: var(--muted);
    }

    .trait-val {
      color: var(--ink);
      font-weight: 600;
    }

    .habitat-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: var(--ink);
      line-height: 1.45;
    }

    /* Close-up Lens Button */
    .closeup-btn {
      margin-top: auto;
      padding-top: 16px;
      display: grid;
      grid-template-columns: 76px 1fr 18px;
      gap: 14px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      align-items: center;
      text-align: left;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s, border-color 0.2s;
    }

    .closeup-btn:hover, .closeup-btn[aria-pressed="true"] {
      border-color: var(--sage);
      background: var(--sage-tint);
    }

    .lens-orb {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background-size: 520%;
      background-repeat: no-repeat;
      border: 1px solid var(--line);
      box-shadow: inset 0 0 12px rgba(var(--shadow), 0.2);
      transition: background-position 0.4s var(--ease), border-color 0.4s;
    }

    .closeup-title {
      font-family: "Newsreader", serif;
      font-size: 18px;
      font-weight: 500;
      color: var(--ink);
    }

    .closeup-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 2px;
    }

    .closeup-chevron {
      transition: transform 0.3s var(--ease);
    }

    .closeup-btn[aria-pressed="true"] .closeup-chevron {
      transform: rotate(180deg);
    }

    /* Focus Mode (Expanded 3D view) */
    .hero.focus .sidebar {
      opacity: 0;
      transform: translateX(-24px);
      pointer-events: none;
    }

    .hero.focus .section-info {
      opacity: 0;
      transform: translateX(24px);
      pointer-events: none;
    }

    .hero.focus .tabs-row {
      opacity: 0;
      transform: translateY(-16px);
      pointer-events: none;
    }

    /* TABLET (<1100px) */
    @media (max-width: 1100px) {
      .hero {
        grid-template-columns: minmax(0, 1fr) clamp(280px, 36vw, 340px);
      }
      .sidebar {
        display: none;
      }
      .section-main {
        padding-left: 20px;
      }
    }

    /* PHONE (<760px) */
    @media (max-width: 760px) {
      .hero {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
      }

      .mobile-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px 0;
        z-index: 12;
      }

      .mobile-brand {
        font-family: "Newsreader", serif;
        font-size: 21px;
        font-weight: 500;
        color: var(--ink);
      }

      .mobile-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-main {
        flex: 1;
        padding: 10px 14px 6px;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .tabs-row {
        width: 100%;
        gap: 8px;
      }

      .tab-btn {
        flex: 1;
        width: auto;
        display: flex;
        align-items: center;
        padding: 6px 10px;
        gap: 8px;
        text-align: left;
      }

      .tab-btn img {
        width: 44px;
        height: 40px;
      }

      .tab-name {
        font-size: 15px;
        margin-top: 0;
      }

      .tab-latin {
        font-size: 12px;
      }

      .icon-rail {
        gap: 7px;
      }

      .rail-btn {
        width: 34px;
        height: 34px;
      }

      .turn-pill {
        bottom: 30px;
      }

      .stage-caption {
        font-size: 15px;
      }

      .stage-hint {
        display: none;
      }

      .ground-shadow {
        bottom: 17%;
        height: 30px;
      }

      /* Detail Card becomes Bottom Sheet */
      .section-info {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 7;
        padding: 0;
        grid-template-rows: 1fr;
        max-height: 40dvh;
        transition: transform 0.4s var(--ease);
      }

      .info-top {
        display: none;
      }

      .detail-card {
        border-radius: 16px 16px 0 0;
        border-left: none;
        border-right: none;
        border-bottom: none;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
        box-shadow: 0 -8px 24px rgba(var(--shadow), 0.14);
      }

      .bird-h1 {
        font-size: 34px;
      }

      .section-h2 {
        font-size: 19px;
      }

      .hero.focus .section-info {
        transform: translateY(100%);
      }

      .hero.focus .mobile-topbar {
        opacity: 0;
        pointer-events: none;
      }
    }

    /* Short desktop screens */
    @media (max-height: 620px) {
      .section-main {
        padding-top: 18px;
      }
      .sidebar {
        padding-top: 14px;
      }
      .featured-img-wrap, .featured-text {
        display: none;
      }
    }

    /* Prefers reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Inline SVG Symbols -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-house" viewBox="0 0 24 24">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>

  <!-- Three.js module logic -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // Bird Specimen Data
    const BIRDS = [
      {
        id: 'hoopoe',
        name: 'Hoopoe',
        latin: 'Upupa epops',
        family: 'UPUPIDAE',
        tags: ['Ground forager', 'Crested', 'Migrant'],
        desc: 'Unmistakable in cinnamon, black and white, the hoopoe walks open ground probing for grubs with its long curved bill. It lifts its crest into a fan when it lands or takes fright, and flies on broad wings with a loose, butterfly-like beat.',
        traits: [
          { icon: '#icon-ruler', label: 'Length', val: '25–29 cm' },
          { icon: '#icon-wing', label: 'Wingspan', val: '44–48 cm' },
          { icon: '#icon-fish', label: 'Diet', val: 'Insects, larvae and grubs' },
          { icon: '#icon-globe', label: 'Range', val: 'Europe, Asia and Africa' }
        ],
        habitat: 'Orchards, vineyards and dry grassland.',
        caption: 'A crown raised, and the orchard takes notice.',
        closeupText: 'Every crest feather ends in a black tip, so the raised fan reads like a row of signal flags.',
        lensPos: '62% 22%',
        featuredTitle: 'A crown of cinnamon.',
        featuredDesc: 'Bold bars on broad wings. A call you hear before you see it.',
        imgUrl: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073256_21ed095c-d038-4ab5-87b7-b44e527ec449.png',
        glbUrl: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073347_06b339a7-70bc-4ecd-9e72-1a4143264da9.glb'
      },
      {
        id: 'kingfisher',
        name: 'Kingfisher',
        latin: 'Alcedo atthis',
        family: 'ALCEDINIDAE',
        tags: ['River bird', 'Diver', 'Iridescent'],
        desc: 'A small, spectacular bird of rivers and lakes, the kingfisher is renowned for its dazzling plumage and astonishing hunting dives. A master of stealth and speed, it links healthy waterways with extraordinary beauty.',
        traits: [
          { icon: '#icon-ruler', label: 'Length', val: '16–17 cm' },
          { icon: '#icon-gauge', label: 'Dive speed', val: 'Up to 40 km/h' },
          { icon: '#icon-fish', label: 'Diet', val: 'Small fish and insects' },
          { icon: '#icon-globe', label: 'Range', val: 'Europe and Asia' }
        ],
        habitat: 'Slow rivers, streams and lakes.',
        caption: 'Blink, and the river keeps its secret.',
        closeupText: 'An intricate mosaic of structure and colour gives the kingfisher its unmistakable sheen.',
        lensPos: '24% 30%',
        featuredTitle: 'A flash of river blue.',
        featuredDesc: 'Extraordinary colours. A remarkable life by the water.',
        imgUrl: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073256_f9e3e60d-acdc-4925-b393-c4ce14b28711.png',
        glbUrl: 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261004_073345_12721630-c589-442f-8884-e4a445cd8980.glb'
      }
    ];

    // State Variables
    let activeBirdIndex = 1; // Kingfisher default
    let isDusk = false;
    let isFocus = false;
    let zoom = 1.0;
    let targetZoom = 1.0;
    let turnQueue = 0;
    let lastInteractionTime = performance.now();
    let hasInteracted = false;

    // Transition variables
    let isSwitching = false;
    let switchStartTime = 0;
    let switchFromIndex = 1;
    let switchToIndex = 1;
    const SWITCH_DURATION = 780; // ms

    // DOM Elements
    const heroEl = document.querySelector('.hero');
    const stageEl = document.getElementById('stage');
    const canvas = document.getElementById('gl');
    const groundShadowEl = document.getElementById('ground-shadow');
    const stageLoaderEl = document.getElementById('stage-loader');
    const stageFallbackEl = document.getElementById('stage-fallback');
    const stageHintEl = document.getElementById('stage-hint');
    const stageCaptionEl = document.getElementById('stage-caption');
    const tabHoopoe = document.getElementById('tab-hoopoe');
    const tabKingfisher = document.getElementById('tab-kingfisher');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnExpand = document.getElementById('btn-expand');
    const btnLight = document.getElementById('btn-light');
    const btnTurnCCW = document.getElementById('btn-turn-ccw');
    const btnTurn360 = document.getElementById('btn-turn-360');
    const btnTurnCW = document.getElementById('btn-turn-cw');
    const btnCloseup = document.getElementById('btn-closeup');

    // Detail Panel Elements
    const detailArticle = document.getElementById('detail-article');
    const detailFamily = document.getElementById('detail-family');
    const detailName = document.getElementById('detail-name');
    const detailTags = document.getElementById('detail-tags');
    const detailDesc = document.getElementById('detail-desc');
    const detailTraits = document.getElementById('detail-traits');
    const detailHabitat = document.getElementById('detail-habitat');
    const detailLens = document.getElementById('detail-lens');
    const detailCloseupText = document.getElementById('detail-closeup-text');
    const featImg = document.getElementById('feat-img');
    const featTitle = document.getElementById('feat-title');
    const featDesc = document.getElementById('feat-desc');

    // Three.js Scene Setup
    const FOV = 26;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    renderer.toneMappingExposure = 1.05;

    // PMREM & RoomEnvironment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();
    const roomEnv = new RoomEnvironment();
    const envTexture = pmremGenerator.fromScene(roomEnv, 0.04).texture;
    scene.environment = envTexture;
    scene.environmentIntensity = 0.95;

    // Lights
    const keyLight = new THREE.DirectionalLight(0xfff4e2, 1.6);
    keyLight.position.set(2.5, 4, 5);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xbfd8ff, 0.5);
    rimLight.position.set(-4, 2, -3);
    scene.add(rimLight);

    // Home Orientation: YXZ yaw 0.75 rad, pitch 0.12 rad
    const homeEuler = new THREE.Euler(0.12, 0.75, 0, 'YXZ');
    const homeQuat = new THREE.Quaternion().setFromEuler(homeEuler);

    // Rig structure for each bird
    // rig: pivot Group > spin Group > holder Group > GLB scene
    const birdRigs = BIRDS.map((bird, idx) => {
      const pivot = new THREE.Group();
      const spin = new THREE.Group();
      const holder = new THREE.Group();

      spin.quaternion.copy(homeQuat);
      pivot.add(spin);
      spin.add(holder);
      scene.add(pivot);

      // Default visible state
      pivot.visible = (idx === activeBirdIndex);

      return {
        bird,
        pivot,
        spin,
        holder,
        loaded: false,
        error: false,
        angularVelocity: new THREE.Vector2(0, 0),
        quaternion: new THREE.Quaternion().copy(homeQuat)
      };
    });

    // GLTF / DRACO Loader setup
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);
    gltfLoader.setMeshoptDecoder(MeshoptDecoder);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    function loadBirdModel(index, onComplete) {
      const rig = birdRigs[index];
      if (rig.loaded) {
        if (onComplete) onComplete(rig);
        return;
      }

      gltfLoader.load(
        rig.bird.glbUrl,
        (gltf) => {
          const model = gltf.scene;

          // Re-centre model on bounding sphere centre
          const box = new THREE.Box3().setFromObject(model);
          const sphere = new THREE.Sphere();
          box.getBoundingSphere(sphere);

          model.position.sub(sphere.center);

          // Scale holder so model has radius 1
          const scale = sphere.radius > 0 ? (1 / sphere.radius) : 1;
          rig.holder.scale.setScalar(scale);

          // Materials optimization & anisotropy
          model.traverse((child) => {
            if (child.isMesh) {
              child.frustumCulled = false;
              if (child.material) {
                child.material.envMapIntensity = 1.0;
                if (child.material.map) {
                  child.material.map.anisotropy = maxAniso;
                }
              }
            }
          });

          rig.holder.add(model);
          rig.loaded = true;

          if (index === activeBirdIndex) {
            stageLoaderEl.classList.remove('active');
            stageFallbackEl.style.display = 'none';
          }

          if (onComplete) onComplete(rig);
        },
        undefined,
        (err) => {
          console.warn('GLB load error for ' + rig.bird.name + ':', err);
          rig.error = true;
          if (index === activeBirdIndex) {
            stageLoaderEl.classList.remove('active');
            stageFallbackEl.src = rig.bird.imgUrl;
            stageFallbackEl.style.display = 'block';
          }
          if (onComplete) onComplete(rig);
        }
      );
    }

    // Load active bird first, then preload the other
    stageLoaderEl.classList.add('active');
    loadBirdModel(activeBirdIndex, () => {
      // Preload other bird
      loadBirdModel(activeBirdIndex === 0 ? 1 : 0);
    });

    // Framing Calculations
    let currentCx = window.innerWidth / 2;
    let currentCy = window.innerHeight / 2;
    let currentPx = Math.min(window.innerWidth * 0.5, window.innerHeight * 0.6) * 1.16;

    let targetCx = currentCx;
    let targetCy = currentCy;
    let targetPx = currentPx;

    function updateFramingTargets() {
      const heroRect = heroEl.getBoundingClientRect();
      const stageRect = stageEl.getBoundingClientRect();

      if (isFocus) {
        targetCx = heroRect.width * 0.5;
        targetCy = heroRect.height * 0.5;
        targetPx = Math.min(heroRect.width * 0.5, heroRect.height * 0.65) * 1.35;
      } else {
        targetCx = stageRect.left - heroRect.left + stageRect.width * 0.5;
        targetCy = stageRect.top - heroRect.top + stageRect.height * 0.44;
        targetPx = Math.min(stageRect.width * 0.5, stageRect.height * 0.6) * 1.16;
      }
    }

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      updateFramingTargets();
    });

    const resizeObserver = new ResizeObserver(() => {
      updateFramingTargets();
    });
    resizeObserver.observe(heroEl);
    resizeObserver.observe(stageEl);
    updateFramingTargets();

    // Interaction Handlers: Pointer Drag Rotation
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;

    stageEl.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      stageEl.setPointerCapture(e.pointerId);
      markInteraction();
    });

    stageEl.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      markInteraction();

      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const k = Math.PI / Math.max(260, currentPx * 1.6);
      const rig = birdRigs[activeBirdIndex];

      const rotY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx * k);
      const rotX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy * k);

      rig.spin.quaternion.premultiply(rotY);
      rig.spin.quaternion.premultiply(rotX);

      // Inertia velocity tracker
      rig.angularVelocity.set(dx * k, dy * k);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try { stageEl.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    stageEl.addEventListener('pointerup', endDrag);
    stageEl.addEventListener('pointercancel', endDrag);

    // Zoom Handlers: Wheel & Pinch
    stageEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      markInteraction();
      const factor = e.ctrlKey ? 0.01 : 0.0016;
      targetZoom *= Math.exp(-e.deltaY * factor);
      targetZoom = THREE.MathUtils.clamp(targetZoom, 0.55, 3.4);
    }, { passive: false });

    // Touch Pinch Zoom
    let initialTouchDist = null;
    let initialZoomOnTouch = 1.0;
    stageEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoomOnTouch = targetZoom;
      }
    });

    stageEl.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialTouchDist) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        targetZoom = THREE.MathUtils.clamp(initialZoomOnTouch * (dist / initialTouchDist), 0.55, 3.4);
        markInteraction();
      }
    });

    stageEl.addEventListener('touchend', () => {
      initialTouchDist = null;
    });

    // Double-click reset
    stageEl.addEventListener('dblclick', () => {
      resetOrientation();
    });

    // Keyboard on Stage
    stageEl.addEventListener('keydown', (e) => {
      markInteraction();
      const rig = birdRigs[activeBirdIndex];
      const stepAngle = 0.18;

      if (e.key === 'ArrowLeft') {
        const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), -stepAngle);
        rig.spin.quaternion.premultiply(q);
      } else if (e.key === 'ArrowRight') {
        const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), stepAngle);
        rig.spin.quaternion.premultiply(q);
      } else if (e.key === 'ArrowUp') {
        const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -stepAngle);
        rig.spin.quaternion.premultiply(q);
      } else if (e.key === 'ArrowDown') {
        const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), stepAngle);
        rig.spin.quaternion.premultiply(q);
      } else if (e.key === '+' || e.key === '=') {
        targetZoom = THREE.MathUtils.clamp(targetZoom * 1.2, 0.55, 3.4);
      } else if (e.key === '-' || e.key === '_') {
        targetZoom = THREE.MathUtils.clamp(targetZoom / 1.2, 0.55, 3.4);
      } else if (e.key === '0') {
        resetOrientation();
      }
    });

    function resetOrientation() {
      const rig = birdRigs[activeBirdIndex];
      rig.spin.quaternion.copy(homeQuat);
      targetZoom = 1.0;
      markInteraction();
    }

    function markInteraction() {
      lastInteractionTime = performance.now();
      if (!hasInteracted) {
        hasInteracted = true;
        stageHintEl.classList.add('hidden');
      }
    }

    // Rail Buttons
    btnZoomIn.addEventListener('click', () => {
      targetZoom = THREE.MathUtils.clamp(targetZoom * 1.35, 0.55, 3.4);
      markInteraction();
    });

    btnZoomOut.addEventListener('click', () => {
      targetZoom = THREE.MathUtils.clamp(targetZoom / 1.35, 0.55, 3.4);
      markInteraction();
    });

    btnExpand.addEventListener('click', () => {
      toggleFocus();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isFocus) {
        toggleFocus();
      }
    });

    function toggleFocus() {
      isFocus = !isFocus;
      heroEl.classList.toggle('focus', isFocus);
      btnExpand.classList.toggle('active', isFocus);
      btnExpand.setAttribute('aria-pressed', isFocus ? 'true' : 'false');
      updateFramingTargets();
      markInteraction();
    }

    // Light Button (Day / Dusk)
    btnLight.addEventListener('click', () => {
      isDusk = !isDusk;
      heroEl.setAttribute('data-light', isDusk ? 'dusk' : 'day');
      btnLight.classList.toggle('active', isDusk);
      btnLight.setAttribute('aria-pressed', isDusk ? 'true' : 'false');
      document.body.style.background = isDusk ? '#14170f' : '#f6f1e7';
      markInteraction();
    });

    // Turn Pill
    btnTurnCCW.addEventListener('click', () => {
      turnQueue -= Math.PI / 2;
      markInteraction();
    });
    btnTurnCW.addEventListener('click', () => {
      turnQueue += Math.PI / 2;
      markInteraction();
    });
    btnTurn360.addEventListener('click', () => {
      turnQueue += Math.PI * 2;
      markInteraction();
    });

    // Close-up Detail Button
    btnCloseup.addEventListener('click', () => {
      if (targetZoom > 2.2) {
        targetZoom = 1.0;
      } else {
        targetZoom = 2.6;
      }
      markInteraction();
    });

    // Tabs & Specimen Switch
    tabHoopoe.addEventListener('click', () => {
      if (activeBirdIndex !== 0) switchSpecimen(0);
    });
    tabKingfisher.addEventListener('click', () => {
      if (activeBirdIndex !== 1) switchSpecimen(1);
    });

    window.addEventListener('keydown', (e) => {
      if (document.activeElement === tabHoopoe || document.activeElement === tabKingfisher) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          switchSpecimen(activeBirdIndex === 0 ? 1 : 0);
        }
      }
    });

    function switchSpecimen(newIndex) {
      if (newIndex === activeBirdIndex || isSwitching) return;

      isSwitching = true;
      switchStartTime = performance.now();
      switchFromIndex = activeBirdIndex;
      switchToIndex = newIndex;

      // Update UI Tabs
      tabHoopoe.setAttribute('aria-selected', newIndex === 0 ? 'true' : 'false');
      tabKingfisher.setAttribute('aria-selected', newIndex === 1 ? 'true' : 'false');

      // Ground shadow fade
      groundShadowEl.classList.add('switching');

      // Reset zoom
      targetZoom = 1.0;

      // Ensure new bird rig is visible & loaded
      const incomingRig = birdRigs[newIndex];
      incomingRig.pivot.visible = true;
      incomingRig.spin.quaternion.copy(homeQuat);

      if (!incomingRig.loaded && !incomingRig.error) {
        stageLoaderEl.classList.add('active');
        loadBirdModel(newIndex, () => {
          stageLoaderEl.classList.remove('active');
        });
      } else if (incomingRig.error) {
        stageFallbackEl.src = incomingRig.bird.imgUrl;
        stageFallbackEl.style.display = 'block';
      } else {
        stageFallbackEl.style.display = 'none';
      }

      // Animate Side Info Out -> Update -> Animate In
      animateDetailSwap(BIRDS[newIndex]);

      activeBirdIndex = newIndex;
      markInteraction();
    }

    function animateDetailSwap(bird) {
      detailArticle.classList.remove('anim-in');
      detailArticle.classList.add('anim-out');

      setTimeout(() => {
        // Update Content
        detailFamily.textContent = bird.family;
        detailName.textContent = bird.name;
        detailDesc.textContent = bird.desc;
        detailHabitat.textContent = bird.habitat;
        stageCaptionEl.textContent = bird.caption;
        detailCloseupText.textContent = bird.closeupText;

        // Tags
        detailTags.innerHTML = bird.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');

        // Traits
        detailTraits.innerHTML = bird.traits.map(tr => `
          <div class="trait-row">
            <svg class="svg-icon" style="color:var(--sage);"><use href="${tr.icon}"></use></svg>
            <span class="trait-label">${tr.label}</span>
            <span class="trait-val">${tr.val}</span>
          </div>
        `).join('');

        // Lens image
        detailLens.style.backgroundImage = `url(${bird.imgUrl})`;
        detailLens.style.backgroundPosition = bird.lensPos;

        // Featured Card
        featImg.src = bird.imgUrl;
        featTitle.textContent = bird.featuredTitle;
        featDesc.textContent = bird.featuredDesc;

        // Animate In with staggered children
        detailArticle.classList.remove('anim-out');
        detailArticle.classList.add('anim-in');

        const children = detailArticle.querySelectorAll('.detail-child');
        children.forEach((child, i) => {
          child.style.animationDelay = `${i * 45}ms`;
        });
      }, 200);
    }

    // Populate initial detail content
    animateDetailSwap(BIRDS[activeBirdIndex]);

    // Animation Loop
    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const dt = THREE.MathUtils.clamp((currentTime - lastTime) / 1000, 0.001, 0.1);
      lastTime = currentTime;

      // 1. Ease Framing (cx, cy, px, zoom)
      const frameFactor = 1 - Math.exp(-dt * 7);
      currentCx += (targetCx - currentCx) * frameFactor;
      currentCy += (targetCy - currentCy) * frameFactor;
      currentPx += (targetPx - currentPx) * frameFactor;

      zoom += (targetZoom - zoom) * (1 - Math.exp(-dt * 6));

      // Update button states for zoom
      btnZoomIn.classList.toggle('active', zoom >= 1.0);
      btnZoomOut.classList.toggle('active', zoom < 1.0);
      btnCloseup.setAttribute('aria-pressed', zoom > 2.2 ? 'true' : 'false');

      // Set Camera Position & View Offset
      const heroW = heroEl.clientWidth;
      const heroH = heroEl.clientHeight;
      const fovRad = (FOV * Math.PI) / 180;
      camera.position.z = heroH / (2 * Math.tan(fovRad / 2) * currentPx * zoom);
      camera.setViewOffset(heroW, heroH, heroW / 2 - currentCx, heroH / 2 - currentCy, heroW, heroH);
      camera.updateProjectionMatrix();

      // 2. Consume Turn Queue
      if (Math.abs(turnQueue) > 0.001) {
        const step = turnQueue * (1 - Math.exp(-dt * 4.2));
        turnQueue -= step;
        const rig = birdRigs[activeBirdIndex];
        const qTurn = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
        rig.spin.quaternion.premultiply(qTurn);
      }

      // 3. Inertia Decay on spin
      const rig = birdRigs[activeBirdIndex];
      if (!isDragging) {
        if (rig.angularVelocity.lengthSq() > 0.000001) {
          const decay = Math.exp(-dt * 4.5);
          const qVelY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), rig.angularVelocity.x);
          const qVelX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), rig.angularVelocity.y);
          rig.spin.quaternion.premultiply(qVelY);
          rig.spin.quaternion.premultiply(qVelX);
          rig.angularVelocity.multiplyScalar(decay);
        }
      }

      // 4. Idle Life (sway & hover after 1.8s)
      const timeSinceInteraction = (currentTime - lastInteractionTime) / 1000;
      if (timeSinceInteraction > 1.8 && !isSwitching) {
        const idleStrength = THREE.MathUtils.clamp((timeSinceInteraction - 1.8) / 1.5, 0, 1);
        const tSec = currentTime * 0.001;

        rig.pivot.rotation.y = Math.sin(tSec * 0.55) * 0.16 * idleStrength;
        rig.pivot.rotation.x = Math.sin(tSec * 0.9) * 0.03 * idleStrength;
        rig.pivot.position.y = Math.sin(tSec * 1.3 + activeBirdIndex) * 0.028 * idleStrength;
      } else if (!isSwitching) {
        rig.pivot.rotation.set(0, 0, 0);
        rig.pivot.position.set(0, 0, 0);
      }

      // 5. Tab Switch Animation (780ms)
      if (isSwitching) {
        const elapsed = currentTime - switchStartTime;
        const progress = THREE.MathUtils.clamp(elapsed / SWITCH_DURATION, 0, 1);
        const dir = Math.sign(switchToIndex - switchFromIndex) || 1;

        const stageWidth = stageEl.clientWidth;
        const slide = (stageWidth * 0.95) / Math.max(10, currentPx);

        const outRig = birdRigs[switchFromIndex];
        const inRig = birdRigs[switchToIndex];

        // Outgoing bird over first 60% with ease-in cubic
        const outProgress = THREE.MathUtils.clamp(progress / 0.6, 0, 1);
        const easeInOut = Math.pow(outProgress, 3);
        outRig.pivot.scale.setScalar(Math.max(0.001, 1 - easeInOut));
        outRig.pivot.position.x = -dir * easeInOut * slide;
        outRig.pivot.rotation.y = -dir * easeInOut * 1.4;

        if (outProgress >= 1) {
          outRig.pivot.visible = false;
        }

        // Incoming bird over full duration with outBack curve
        const t = progress;
        const easeOut = 1 - Math.pow(1 - t, 3);
        const outBack = 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);
        const inScale = Math.max(0.001, outBack * (0.25 + 0.75 * easeOut));

        inRig.pivot.scale.setScalar(inScale);
        inRig.pivot.position.x = dir * (1 - easeOut) * slide;
        inRig.pivot.rotation.y = dir * (1 - easeOut) * 1.6;

        if (progress >= 1) {
          isSwitching = false;
          outRig.pivot.visible = false;
          inRig.pivot.scale.setScalar(1);
          inRig.pivot.position.set(0, 0, 0);
          inRig.pivot.rotation.set(0, 0, 0);
          groundShadowEl.classList.remove('switching');
        }
      }

      // 6. Dusk / Day Lights Ease
      const lightRate = 1 - Math.exp(-dt * 4);
      if (isDusk) {
        scene.environmentIntensity += (0.28 - scene.environmentIntensity) * lightRate;
        renderer.toneMappingExposure += (1.0 - renderer.toneMappingExposure) * lightRate;
        keyLight.intensity += (2.6 - keyLight.intensity) * lightRate;
        keyLight.color.lerp(new THREE.Color('#ffc98a'), lightRate);
        rimLight.intensity += (1.9 - rimLight.intensity) * lightRate;
      } else {
        scene.environmentIntensity += (0.95 - scene.environmentIntensity) * lightRate;
        renderer.toneMappingExposure += (1.05 - renderer.toneMappingExposure) * lightRate;
        keyLight.intensity += (1.6 - keyLight.intensity) * lightRate;
        keyLight.color.lerp(new THREE.Color('#fff4e2'), lightRate);
        rimLight.intensity += (0.5 - rimLight.intensity) * lightRate;
      }

      // Render Scene
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
